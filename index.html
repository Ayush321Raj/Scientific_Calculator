<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Scientific Calculator – Fast, Accurate, Modern" />
  <title>Smart Scientific Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- Main wrapper -->
  <div class="app-wrapper">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="header-logo">
        <div class="calc-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#g1)"/>
            <rect x="10" y="10" width="12" height="8" rx="3" fill="white" fill-opacity="0.9"/>
            <rect x="26" y="10" width="12" height="8" rx="3" fill="white" fill-opacity="0.9"/>
            <rect x="10" y="22" width="6" height="6" rx="2" fill="white" fill-opacity="0.8"/>
            <rect x="21" y="22" width="6" height="6" rx="2" fill="white" fill-opacity="0.8"/>
            <rect x="32" y="22" width="6" height="6" rx="2" fill="white" fill-opacity="0.8"/>
            <rect x="10" y="32" width="6" height="6" rx="2" fill="white" fill-opacity="0.8"/>
            <rect x="21" y="32" width="6" height="6" rx="2" fill="white" fill-opacity="0.8"/>
            <rect x="32" y="32" width="6" height="6" rx="2" fill="#a78bfa" fill-opacity="0.9"/>
            <defs>
              <linearGradient id="g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="header-text">
          <h1>Smart Scientific Calculator</h1>
          <p class="subtitle">Fast &bull; Accurate &bull; Modern</p>
        </div>
      </div>

      <div class="header-controls">
        <!-- Date/Time -->
        <div class="datetime-widget">
          <span id="live-date" aria-label="Current date"></span>
          <span id="live-time" aria-label="Current time"></span>
        </div>

        <!-- Sound toggle -->
        <button id="btn-sound" class="icon-btn" aria-label="Toggle sound" title="Toggle sound">
          <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>

        <!-- Theme switcher -->
        <div class="theme-picker" role="group" aria-label="Choose theme">
          <button class="theme-btn active" data-theme="dark"     title="Dark"      aria-label="Dark theme"></button>
          <button class="theme-btn"        data-theme="light"    title="Light"     aria-label="Light theme"></button>
          <button class="theme-btn"        data-theme="cyberpunk" title="Cyberpunk" aria-label="Cyberpunk theme"></button>
          <button class="theme-btn"        data-theme="ocean"    title="Ocean"     aria-label="Ocean theme"></button>
          <button class="theme-btn"        data-theme="sunset"   title="Sunset"    aria-label="Sunset theme"></button>
          <button class="theme-btn"        data-theme="forest"   title="Forest"    aria-label="Forest theme"></button>
          <button class="theme-btn"        data-theme="midnight" title="Midnight"  aria-label="Midnight theme"></button>
        </div>
      </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <main class="main-layout">

      <!-- ===== CALCULATOR CARD ===== -->
      <section class="calc-card" aria-label="Calculator">

        <!-- Mode Toggle -->
        <div class="mode-toggle" role="group" aria-label="Calculator mode">
          <button id="btn-basic"      class="mode-btn active" data-mode="basic"      aria-pressed="true">Basic</button>
          <button id="btn-scientific" class="mode-btn"        data-mode="scientific" aria-pressed="false">Scientific</button>
          <div class="mode-slider" aria-hidden="true"></div>
        </div>

        <!-- Display -->
        <div class="calc-display" aria-label="Calculator display">
          <div class="display-top">
            <div id="display-expression" class="display-expression" aria-label="Current expression" role="status"></div>
            <button id="btn-copy-result" class="copy-btn" aria-label="Copy result" title="Copy result">
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
          </div>
          <div id="display-result" class="display-result" aria-label="Result" role="status">0</div>
          <div class="display-footer">
            <span id="display-mode-label" class="mode-label">BASIC</span>
            <span id="display-angle-label" class="angle-label">DEG</span>
            <span id="display-memory-label" class="memory-label"></span>
          </div>
        </div>

        <!-- Scientific Panel -->
        <div id="scientific-panel" class="scientific-panel" aria-label="Scientific functions" hidden>
          <!-- Row 1: Memory + Angle -->
          <div class="sci-row">
            <button class="btn sci-btn mem-btn" data-action="mc"   aria-label="Memory Clear">MC</button>
            <button class="btn sci-btn mem-btn" data-action="mr"   aria-label="Memory Recall">MR</button>
            <button class="btn sci-btn mem-btn" data-action="ms"   aria-label="Memory Store">MS</button>
            <button class="btn sci-btn mem-btn" data-action="mplus"  aria-label="Memory Add">M+</button>
            <button class="btn sci-btn mem-btn" data-action="mminus" aria-label="Memory Subtract">M−</button>
            <button id="btn-angle" class="btn sci-btn angle-btn" data-action="toggleAngle" aria-label="Toggle degrees/radians">DEG</button>
          </div>
          <!-- Row 2: Trig -->
          <div class="sci-row">
            <button class="btn sci-btn trig-btn" data-action="sin"  aria-label="Sine">sin</button>
            <button class="btn sci-btn trig-btn" data-action="cos"  aria-label="Cosine">cos</button>
            <button class="btn sci-btn trig-btn" data-action="tan"  aria-label="Tangent">tan</button>
            <button class="btn sci-btn trig-btn" data-action="asin" aria-label="Arc Sine">sin⁻¹</button>
            <button class="btn sci-btn trig-btn" data-action="acos" aria-label="Arc Cosine">cos⁻¹</button>
            <button class="btn sci-btn trig-btn" data-action="atan" aria-label="Arc Tangent">tan⁻¹</button>
          </div>
          <!-- Row 3: Log/Exp -->
          <div class="sci-row">
            <button class="btn sci-btn log-btn" data-action="log"   aria-label="Log base 10">log</button>
            <button class="btn sci-btn log-btn" data-action="ln"    aria-label="Natural log">ln</button>
            <button class="btn sci-btn log-btn" data-action="exp"   aria-label="e to the power x">eˣ</button>
            <button class="btn sci-btn log-btn" data-action="tenx"  aria-label="10 to the power x">10ˣ</button>
            <button class="btn sci-btn log-btn" data-action="sqrt"  aria-label="Square root">√</button>
            <button class="btn sci-btn log-btn" data-action="cbrt"  aria-label="Cube root">∛</button>
          </div>
          <!-- Row 4: Powers / Special -->
          <div class="sci-row">
            <button class="btn sci-btn pow-btn" data-action="x2"    aria-label="x squared">x²</button>
            <button class="btn sci-btn pow-btn" data-action="x3"    aria-label="x cubed">x³</button>
            <button class="btn sci-btn pow-btn" data-action="xy"    aria-label="x to the power y">xʸ</button>
            <button class="btn sci-btn pow-btn" data-action="abs"   aria-label="Absolute value">|x|</button>
            <button class="btn sci-btn pow-btn" data-action="fact"  aria-label="Factorial">n!</button>
            <button class="btn sci-btn pow-btn" data-action="mod"   aria-label="Modulo">mod</button>
          </div>
          <!-- Row 5: Constants / Misc -->
          <div class="sci-row">
            <button class="btn sci-btn const-btn" data-action="pi"    aria-label="Pi">π</button>
            <button class="btn sci-btn const-btn" data-action="euler" aria-label="Euler's number">e</button>
            <button class="btn sci-btn const-btn" data-action="rand"  aria-label="Random number">RND</button>
            <button class="btn sci-btn const-btn" data-action="round" aria-label="Round">RND↑</button>
            <button class="btn sci-btn const-btn" data-action="floor" aria-label="Floor">⌊x⌋</button>
            <button class="btn sci-btn const-btn" data-action="ceil"  aria-label="Ceiling">⌈x⌉</button>
          </div>
        </div>

        <!-- Basic Keypad -->
        <div id="basic-keypad" class="basic-keypad" aria-label="Basic calculator keys">
          <!-- Row 1 -->
          <button class="btn func-btn" data-action="ac"        aria-label="All Clear">AC</button>
          <button class="btn func-btn" data-action="ce"        aria-label="Clear Entry">CE</button>
          <button class="btn func-btn" data-action="percent"   aria-label="Percent">%</button>
          <button class="btn op-btn"   data-action="÷"         aria-label="Divide">÷</button>
          <!-- Row 2 -->
          <button class="btn num-btn"  data-action="7"         aria-label="7">7</button>
          <button class="btn num-btn"  data-action="8"         aria-label="8">8</button>
          <button class="btn num-btn"  data-action="9"         aria-label="9">9</button>
          <button class="btn op-btn"   data-action="×"         aria-label="Multiply">×</button>
          <!-- Row 3 -->
          <button class="btn num-btn"  data-action="4"         aria-label="4">4</button>
          <button class="btn num-btn"  data-action="5"         aria-label="5">5</button>
          <button class="btn num-btn"  data-action="6"         aria-label="6">6</button>
          <button class="btn op-btn"   data-action="−"         aria-label="Subtract">−</button>
          <!-- Row 4 -->
          <button class="btn num-btn"  data-action="1"         aria-label="1">1</button>
          <button class="btn num-btn"  data-action="2"         aria-label="2">2</button>
          <button class="btn num-btn"  data-action="3"         aria-label="3">3</button>
          <button class="btn op-btn"   data-action="+"         aria-label="Add">+</button>
          <!-- Row 5 -->
          <button class="btn func-btn" data-action="sign"      aria-label="Toggle sign">+/−</button>
          <button class="btn num-btn"  data-action="0"         aria-label="0">0</button>
          <button class="btn num-btn"  data-action="."         aria-label="Decimal point">.</button>
          <button class="btn eq-btn"   data-action="="         aria-label="Equals">=</button>
          <!-- Extra row: power, sqrt, backspace -->
          <button class="btn func-btn" data-action="x2"        aria-label="Square">x²</button>
          <button class="btn func-btn" data-action="sqrt"      aria-label="Square root">√</button>
          <button class="btn func-btn" data-action="("         aria-label="Open parenthesis">(</button>
          <button class="btn func-btn bksp-btn" data-action="backspace" aria-label="Backspace">⌫</button>
        </div>

      </section>

      <!-- ===== SIDE PANELS ===== -->
      <aside class="side-panels">

        <!-- Stats widget -->
        <div class="panel stats-panel" aria-label="Calculation statistics">
          <h3 class="panel-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Statistics
          </h3>
          <div class="stats-grid">
            <div class="stat-item"><span class="stat-val" id="stat-count">0</span><span class="stat-lbl">Calculations</span></div>
            <div class="stat-item"><span class="stat-val" id="stat-avg">—</span><span class="stat-lbl">Average</span></div>
            <div class="stat-item"><span class="stat-val" id="stat-max">—</span><span class="stat-lbl">Largest</span></div>
            <div class="stat-item"><span class="stat-val" id="stat-min">—</span><span class="stat-lbl">Smallest</span></div>
          </div>
        </div>

        <!-- History panel -->
        <div class="panel history-panel" aria-label="Calculation history">
          <div class="panel-header">
            <h3 class="panel-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
              History
            </h3>
            <div class="history-actions">
              <button id="btn-export-history" class="small-btn" aria-label="Export history as TXT" title="Export TXT">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              </button>
              <button id="btn-clear-history" class="small-btn danger-btn" aria-label="Clear all history" title="Clear all">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
          <input type="search" id="history-search" class="history-search" placeholder="Search calculations…" aria-label="Search history" />
          <ul id="history-list" class="history-list" aria-label="History entries" aria-live="polite">
            <li class="history-empty">No calculations yet</li>
          </ul>
        </div>

      </aside>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
      <span>Created with <span class="heart">❤️</span> by Smart Calculator</span>
      <span class="footer-sep">|</span>
      <span>Version 1.0</span>
      <span class="footer-sep">|</span>
      <span>Responsive Design</span>
    </footer>

  </div><!-- /.app-wrapper -->

  <!-- FAB -->
  <div class="fab-container" aria-label="Quick actions">
    <button class="fab-main" id="fab-main" aria-label="Quick actions menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <div class="fab-menu" id="fab-menu" aria-hidden="true">
      <button class="fab-item" data-fab="clear"  aria-label="Quick clear">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        <span>Clear</span>
      </button>
      <button class="fab-item" data-fab="copy"   aria-label="Quick copy result">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span>Copy</span>
      </button>
      <button class="fab-item" data-fab="tips"   aria-label="Calculator tips">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>Tips</span>
      </button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
